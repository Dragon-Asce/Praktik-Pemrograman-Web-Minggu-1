<!DOCTYPE html>
<html>
<head>
    <title>Pemrograman Web Dasar</title>
    <style>
        body {
            margin: 0;
            display: grid;
            grid-template-rows: 100px auto 60px; 
            grid-template-columns: 250px auto 200px;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar, .footer {
            background-color: #0461af;
            color: white;
            grid-column: 1 / 4;
            padding: 10px 20px;
        }

        .menu-kiri, .menu-kanan {
            background-color: darkgray;
            padding: 15px;
        }

        .konten-tengah {
            background-color: ghostwhite;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: blue;
            color: white;
            padding: 10px;
            border: 1px solid gray;
        }
        td {
            background-color: yellow;
            text-align: center;
            padding: 5px;
            border: 1px solid gray;
        }
        td a {
            text-decoration: underline;
            color: blue;
        }

        .menu-kanan {
            text-align: center;
        }
        .menu-kanan a {
            color: blue;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2 style="margin: 5px 0;">PEMROGRAMAN WEB DASAR</h2>
        <i style="font-size: 14px;">Topik HTML PHP, MySQL</i>
    </div>

    <div class="menu-kiri">
        <table>
            <tr><th>MENU</th></tr>
            <tr><td><a href="welcome.html" target="isi_halaman">Beranda</a></td></tr>
            <tr><td><a href="menu1.html" target="isi_halaman">Menu 1</a></td></tr>
            <tr><td><a href="menu2.html" target="isi_halaman">Menu 2</a></td></tr>
            <tr><td><a href="menu3.html" target="isi_halaman">Menu 3</a></td></tr>
            <tr><td><a href="menu4.html" target="isi_halaman">Menu 4</a></td></tr>
            <tr><td><a href="menu5.html" target="isi_halaman">Menu 5</a></td></tr>
            <tr><td><a href="menu6.html" target="isi_halaman">Menu 6</a></td></tr>
        </table>
    </div>

    <div class="konten-tengah">
        <iframe name="isi_halaman" src="welcome.html"></iframe>
    </div>

    <div class="menu-kanan">
        <img src="logo_polman.png" width="100px" alt="Logo Polman"><br><br>
        <a href="https://upload.wikimedia.org/wikipedia/id/9/9a/Logo_Polman_Bandung.png?utm_source=id.wikipedia.org&utm_campaign=parser&utm_content=thumbnail_unscaled">Link 1</a>
        <a href="#">Link 2</a>
        <a href="#">Link 3</a>
    </div>

    <div class="footer">
        <div style="font-size: 14px;">Dikembangkan oleh: Farhan Maulana</div>
        <div style="font-size: 14px;">@2026</div>
    </div>

</body>
